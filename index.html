<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>定期演奏会 特典動画</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #000;
      color: #fff;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      overflow: hidden;
    }

    .page {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100dvh;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    video {
      width: 100vw;
      height: 100dvh;
      object-fit: contain;
      background: #000;
    }

    .start-layer {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      padding: 24px;
      text-align: center;
      background: linear-gradient(rgba(0, 0, 0, 0.45), rgba(0, 0, 0, 0.75));
      cursor: pointer;
    }

    .start-button {
      width: 88px;
      height: 88px;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.9);
      display: grid;
      place-items: center;
      background: rgba(255, 255, 255, 0.14);
      backdrop-filter: blur(6px);
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.35);
    }

    .triangle {
      width: 0;
      height: 0;
      margin-left: 7px;
      border-top: 18px solid transparent;
      border-bottom: 18px solid transparent;
      border-left: 28px solid #fff;
    }

    .title {
      font-size: clamp(20px, 5vw, 34px);
      font-weight: 700;
      line-height: 1.35;
      letter-spacing: 0.04em;
    }

    .message {
      font-size: clamp(14px, 3.5vw, 18px);
      line-height: 1.7;
      color: rgba(255, 255, 255, 0.9);
      max-width: 520px;
    }

    .hidden {
      display: none;
    }
  </style>
</head>
<body>
  <main class="page">
    <!-- video.mp4 を自分の動画ファイル名に変更してください -->
    <video id="bonusVideo" src="video.mp4" playsinline controls preload="metadata"></video>

    <div id="startLayer" class="start-layer" role="button" aria-label="動画を再生する">
      <div class="start-button">
        <div class="triangle"></div>
      </div>
      <div class="title">特典動画</div>
      <div class="message">画面をタップすると動画が再生されます。</div>
    </div>
  </main>

  <script>
    const video = document.getElementById('bonusVideo');
    const startLayer = document.getElementById('startLayer');

    async function startVideo() {
      try {
        await video.play();
        startLayer.classList.add('hidden');
      } catch (error) {
        // スマホブラウザでは自動再生が制限される場合があるため、
        // ユーザーのタップ後に再生する設計にしています。
        console.error(error);
      }
    }

    startLayer.addEventListener('click', startVideo);
    startLayer.addEventListener('touchstart', startVideo, { passive: true });
  </script>
</body>
</html>
