<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>特典動画</title>

<style>
html,body{
  margin:0;
  height:100%;
  background:#000;
}

.wrap{
  position:fixed;
  inset:0;
  width:100vw;
  height:100dvh;
}

iframe{
  width:100%;
  height:100%;
  border:0;
}

.overlay{
  position:fixed;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  background:rgba(0,0,0,0.6);
  color:white;
  font-size:20px;
  z-index:10;
}
</style>
</head>

<body>

<div class="wrap">
  <iframe id="player"
    src="https://1drv.ms/v/c/f0e081f8c6d5a5b8/IQQnkDSXHTTfQoTUP2B65hryARCJbF-PUSqQmTOdiQVeaFk"
    allow="autoplay; fullscreen"
    allowfullscreen>
  </iframe>
</div>

<div class="overlay" onclick="start()">
  ▶ タップして再生
</div>

<script>
function start(){
  document.querySelector('.overlay').style.display='none';
}
</script>

</body>
</html>
